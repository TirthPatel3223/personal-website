<!doctype html>
<!-- Renderer for the solver stage images (driven by render-maltese-stages.py, served from the site root).
     It draws the Maltese Gear Cube with the simulator's materials and lights, every piece in one of four
     looks, and returns the colour image plus a mask of the pieces being solved (for the glow). -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        background: transparent;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "/node_modules/three/build/three.module.js",
          "three/addons/": "/node_modules/three/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <script type="module">
      import * as THREE from 'three';
      import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

      const data = await (await fetch('/scripts/3d/render/maltese-stages.json')).json();

      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.NeutralToneMapping;
      renderer.toneMappingExposure = 1.0;
      renderer.setClearColor(0x000000, 0);
      document.body.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      const pmrem = new THREE.PMREMGenerator(renderer);
      const envMap = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
      scene.environment = envMap;
      scene.environmentIntensity = 0.55;

      // The simulator's lights, fixed to the viewer.
      const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
      const lights = new THREE.Group();
      const key = new THREE.DirectionalLight(0xffffff, 1.6);
      key.position.set(-3, 6, 5);
      const fill = new THREE.DirectionalLight(0xffffff, 0.5);
      fill.position.set(5, 1, 3);
      const rim = new THREE.DirectionalLight(0xdfe8ff, 0.5);
      rim.position.set(2, 3, -6);
      lights.add(key, fill, rim);
      camera.add(lights);
      scene.add(camera);

      function bodyGeometry(m) {
        const g = new THREE.BufferGeometry();
        g.setAttribute('position', new THREE.Float32BufferAttribute(m.positions, 3));
        g.setAttribute('normal', new THREE.Float32BufferAttribute(m.normals, 3));
        g.setIndex(m.indices);
        return g;
      }
      function stickerGeometry(s) {
        const g = new THREE.BufferGeometry();
        g.setAttribute('position', new THREE.Float32BufferAttribute(s.positions, 3));
        const n = new Float32Array(s.positions.length);
        for (let i = 0; i < n.length; i += 3) n.set(s.normal, i);
        g.setAttribute('normal', new THREE.BufferAttribute(n, 3));
        g.setIndex(s.indices);
        return g;
      }
      const protos = Object.fromEntries(
        Object.entries(data.protos).map(([k, p]) => [k, { body: bodyGeometry(p.body), stickers: p.stickers.map(stickerGeometry) }]),
      );

      const plastic = (color, emissive = '#000000', emissiveIntensity = 0, matte = false) =>
        new THREE.MeshPhysicalMaterial({
          color,
          emissive,
          emissiveIntensity,
          roughness: matte ? 0.8 : 0.42,
          metalness: 0,
          specularIntensity: matte ? 0.15 : 0.35,
          clearcoat: matte ? 0 : 0.3,
          clearcoatRoughness: 0.25,
          envMapIntensity: matte ? 0.4 : 0.7,
        });
      const sticker = (color, emissive = 0, matte = false) =>
        new THREE.MeshPhysicalMaterial({
          color,
          emissive: color,
          emissiveIntensity: emissive,
          roughness: matte ? 0.85 : 0.45,
          metalness: 0,
          specularIntensity: matte ? 0.15 : 0.5,
          clearcoat: matte ? 0 : 0.25,
          clearcoatRoughness: 0.3,
          polygonOffset: true,
          polygonOffsetFactor: -1,
          polygonOffsetUnits: -1,
        });

      const core = new THREE.Mesh(
        bodyGeometry(data.core),
        new THREE.MeshPhysicalMaterial({ color: data.coreColor, roughness: 0.92, metalness: 0, specularIntensity: 0.2 }),
      );
      scene.add(core);

      const pieceGroups = data.pieces.map((p) => {
        const g = new THREE.Group();
        g.matrixAutoUpdate = false;
        const body = new THREE.Mesh(protos[p.kind].body);
        g.add(body);
        const stickers = protos[p.kind].stickers.map((sg) => {
          const m = new THREE.Mesh(sg);
          g.add(m);
          return m;
        });
        scene.add(g);
        return { body, stickers };
      });

      const MASK_ON = new THREE.MeshBasicMaterial({ color: 0xffffff });
      const MASK_OFF = new THREE.MeshBasicMaterial({ color: 0x000000 });

      /** A solved-earlier colour: mostly desaturated and a little darker, so it reads as settled, not active. */
      const muted = (hex, desat, dark) => {
        const c = new THREE.Color(hex);
        const l = 0.2126 * c.r + 0.7152 * c.g + 0.0722 * c.b;
        return c.lerp(new THREE.Color(l, l, l), desat).multiplyScalar(dark);
      };

      /**
       * spec: { pose, looks: [per piece 'now' | 'accent' | 'done' | 'off' | 'full'], accent, grey, greyBody,
       *         size, azimuth, elevation, distance }
       */
      window.renderImage = (spec) => {
        const size = spec.size;
        renderer.setSize(size, size, false);
        const az = (spec.azimuth * Math.PI) / 180;
        const el = (spec.elevation * Math.PI) / 180;
        const d = spec.distance;
        camera.position.set(Math.sin(az) * Math.cos(el) * d, Math.sin(el) * d, Math.cos(az) * Math.cos(el) * d);
        camera.lookAt(0, spec.lookY ?? 0, 0);
        camera.updateMatrixWorld(true);

        const pose = data.poses[spec.pose];
        const mats = [];
        data.pieces.forEach((p, i) => {
          const m = pose[i];
          const g = pieceGroups[i].body.parent;
          g.matrix.set(m[0], m[1], m[2], 0, m[3], m[4], m[5], 0, m[6], m[7], m[8], 0, 0, 0, 0, 1);
          g.matrixWorldNeedsUpdate = true;
          const look = spec.looks[i];
          const pg = pieceGroups[i];
          let bodyMat;
          let stickerMats;
          const lit = () => plastic(data.body, spec.accent, spec.bodyGlow ?? 0);
          if (look === 'off') {
            bodyMat = plastic(spec.greyBody, '#000000', 0, true);
            stickerMats = p.colors.map(() => sticker(spec.grey, 0, true));
          } else if (look === 'accent') {
            bodyMat = lit();
            stickerMats = p.colors.map(() => sticker(spec.accent, spec.nowGlow ?? 0.12));
          } else if (look === 'done') {
            bodyMat = plastic(data.body);
            stickerMats = p.colors.map((c) => sticker(muted(data.colors[c], spec.doneDesat, spec.doneDark)));
          } else if (look === 'now') {
            bodyMat = lit();
            stickerMats = p.colors.map((c) => sticker(data.colors[c], spec.nowGlow ?? 0.12));
          } else {
            bodyMat = plastic(data.body);
            stickerMats = p.colors.map((c) => sticker(data.colors[c]));
          }
          pg.body.material = bodyMat;
          pg.stickers.forEach((s, k) => (s.material = stickerMats[k]));
          mats.push(bodyMat, ...stickerMats);
        });

        renderer.toneMapping = THREE.NeutralToneMapping;
        scene.environment = envMap;
        core.visible = true;
        renderer.render(scene, camera);
        const color = renderer.domElement.toDataURL('image/png');

        // Mask: the visible parts of the pieces being solved, white on black.
        renderer.toneMapping = THREE.NoToneMapping;
        scene.environment = null;
        const saved = pieceGroups.map((pg) => [pg.body.material, pg.stickers.map((s) => s.material)]);
        const prevCore = core.material;
        core.material = MASK_OFF;
        pieceGroups.forEach((pg, i) => {
          const on = spec.looks[i] === 'now' || spec.looks[i] === 'accent';
          pg.body.material = on ? MASK_ON : MASK_OFF;
          pg.stickers.forEach((s) => (s.material = on ? MASK_ON : MASK_OFF));
        });
        renderer.setClearColor(0x000000, 1);
        renderer.render(scene, camera);
        const mask = renderer.domElement.toDataURL('image/png');
        renderer.setClearColor(0x000000, 0);
        core.material = prevCore;
        pieceGroups.forEach((pg, i) => {
          pg.body.material = saved[i][0];
          pg.stickers.forEach((s, k) => (s.material = saved[i][1][k]));
        });
        mats.forEach((m) => m.dispose());
        return { color, mask };
      };
      window.ready = true;
    </script>
  </body>
</html>
